<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#f6f3ec;--paper:#fffdf8;--ink:#1d1b18;--muted:#6b655c;--line:#ddd6c9;--chip:#efe9dd;--accent:#7a3fb0;--ok:#1f7a6d;--err:#b4432a;--tok:#ece2fb;--gl:#dff0ea;
  --serif:"Iowan Old Style",Palatino,Georgia,serif;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai","Noto Sans JP",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15140f;--paper:#1d1b16;--ink:#ece6da;--muted:#a59e91;--line:#3a362e;--chip:#2a2720;--accent:#c39bf0;--ok:#4fc3ae;--err:#f07a5c;--tok:#3a2f4d;--gl:#173a33}}
:root[data-theme="dark"]{--bg:#15140f;--paper:#1d1b16;--ink:#ece6da;--muted:#a59e91;--line:#3a362e;--chip:#2a2720;--accent:#c39bf0;--ok:#4fc3ae;--err:#f07a5c;--tok:#3a2f4d;--gl:#173a33}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans)}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 70px}
.eyebrow{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font:600 30px/1.2 var(--serif);margin:10px 0 4px}.sub{color:var(--muted);margin:0}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.btn{font:inherit;font-size:12.5px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px}.tile b{display:block;font:600 28px/1 var(--serif)}.tile span{color:var(--muted);font-size:12.5px}
.tile.ok b{color:var(--ok)}.tile.err b{color:var(--err)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.bar input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);flex:1;min-width:220px}
.chips button{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--muted);cursor:pointer;margin-right:4px}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;padding:12px 16px;margin-bottom:10px}
.row.rejected{border-left-color:var(--err)}
.hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;margin-bottom:8px}
.key{font:12px var(--mono);color:var(--muted);overflow-wrap:anywhere}.sp{font-size:11.5px;background:var(--chip);border-radius:999px;padding:1px 8px}
.st{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ok)}.rejected .st{color:var(--err)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pair label{display:block;font:600 10px var(--mono);color:var(--muted);text-transform:uppercase;margin-bottom:3px}
.txt{font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}.pair .tgt .txt{font-size:16px}
mark{background:var(--tok);color:inherit;border-radius:3px;padding:0 3px;font-family:var(--mono);font-size:.85em}
.gl{display:inline-block;font-size:12px;background:var(--gl);border-radius:6px;padding:1px 7px;margin:6px 6px 0 0}
.gl.miss{background:transparent;border:1px dashed var(--err);color:var(--err)}
.prob{margin-top:8px;color:var(--err);font-size:13px}
.note{margin-top:6px;font-size:12.5px;color:var(--muted)}
@media(max-width:760px){.pair{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:24px}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><div class="eyebrow">Translation review · loc-translate</div><h1>__TITLE__</h1><p class="sub" id="meta"></p></div><button class="btn" id="theme">Theme</button></div>
<div class="tiles" id="tiles"></div>
<div class="bar"><input type="search" id="q" placeholder="Search key or text…"><div class="chips" id="f"></div></div>
<div id="rows"></div>
</div>
<script>
const DATA=/*__DATA__*/null;
(function(){
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
document.title=DATA.title;const R=DATA.rows;
$("#meta").textContent=`${DATA.project} · ${DATA.source_lang} → ${DATA.target_lang} · ${DATA.batches.join(", ")} · ${DATA.generated}`;
const TOK={smapi:/\{\{[^{}]+\}\}|#\$(?:b|e)#|#\$(?:q|r|p|d|c|k|t|1|action|query)\b[^#]*|\$(?:h|s|u|l|a|neutral|\d{1,2})(?=#|\^|\s*$)|%item\b[^%]*%%|%(?:adj|noun|place|spouse|name|pet|farm|kid1|kid2|fork|book|rival|favorite|time|season)\b|@|#|\^|¦|\{\d+(?::[^{}]*)?\}|\{[A-Za-z]\w*(?::\w+)?\}/g,
 app:/\{[A-Za-z_][\w.]*\}|\{\d+(?::[^{}]*)?\}|%(?:\d+\$)?[-+ 0#]*\d*(?:\.\d+)?[diouxXeEfgGcsp@%]|\{\{[^{}]+\}\}|<\/?[a-zA-Z][^<>]*>|&(?:[a-zA-Z]+|#\d+);/g};
const rx=TOK[DATA.profile]||TOK.app;
const hl=t=>{let o="",l=0;(t||"").replace(rx,(m,i)=>{o+=esc(t.slice(l,i))+`<mark>${esc(m)}</mark>`;l=i+m.length;return m});return o+esc((t||"").slice(l))};
const ok=R.filter(r=>r.status==="written").length,toks=R.reduce((n,r)=>n+((r.source||"").match(rx)||[]).length,0),gl=R.reduce((n,r)=>n+(r.glossary||[]).length,0);
$("#tiles").innerHTML=[[ok,"written","ok"],[R.length-ok,"rejected — see reasons",R.length-ok?"err":"ok"],[toks,"tokens protected",""],[gl,"glossary terms applied",""]].map(([n,l,c])=>`<div class="tile ${c}"><b>${n}</b><span>${l}</span></div>`).join("");
let F="all",q="";
function chips(){$("#f").innerHTML=[["all","all"],["written","written"],["rejected","rejected"]].map(([k,l])=>`<button data-v="${k}" aria-pressed="${F===k}">${l}</button>`).join("");document.querySelectorAll("#f button").forEach(b=>b.onclick=()=>{F=b.dataset.v;draw()})}
function draw(){chips();let L=R.filter(r=>F==="all"||r.status===F);if(q)L=L.filter(r=>(r.key+" "+r.source+" "+r.translation).toLowerCase().includes(q));
 $("#rows").innerHTML=L.map(r=>`<div class="row ${r.status}"><div class="hd"><span class="st">${r.status}</span><span class="key">${esc(r.group)} :: ${esc(r.key)}</span>${r.speaker?`<span class="sp">${esc(r.speaker)}</span>`:""}</div>
 <div class="pair"><div><label>${esc(DATA.source_lang)}</label><div class="txt">${hl(r.source)}</div></div><div class="tgt"><label>${esc(DATA.target_lang)}</label><div class="txt">${r.status==="written"?hl(r.translation):esc(r.translation)}</div></div></div>
 ${(r.glossary||[]).map(g=>`<span class="gl ${r.translation&&r.translation.includes(g.target)?"":"miss"}">${esc(g.source)} → ${esc(g.target)}</span>`).join("")}
 ${r.problems?`<div class="prob">✗ ${r.problems.map(esc).join("; ")}</div>`:""}${r.note?`<div class="note">note: ${esc(r.note)}</div>`:""}</div>`).join("")||`<p class="sub">Nothing matches.</p>`}
$("#q").oninput=e=>{q=e.target.value.toLowerCase();draw()};
$("#theme").onclick=()=>{const r=document.documentElement,d=matchMedia("(prefers-color-scheme: dark)").matches,c=r.dataset.theme||(d?"dark":"light");r.dataset.theme=c==="dark"?"light":"dark"};
draw();
})();
</script></body></html>
